name: 生成音乐列表

on:
  # 手动触发
  workflow_dispatch:

  # music 文件夹发生变化时自动触发
  push:
    paths:
      - "music/**"
      - ".github/workflows/生成音乐列表.yml"

permissions:
  contents: write

jobs:
  generate:
    name: 生成音乐列表
    runs-on: ubuntu-latest

    steps:
      # 获取仓库
      - name: 获取仓库
        uses: actions/checkout@v6

      # 生成 music/music.json
      - name: 生成 music.json
        run: |
          python - <<'PY'
          import os
          import json

          文件夹 = "music"

          音乐列表 = [
              文件
              for 文件 in os.listdir(文件夹)
              if os.path.isfile(os.path.join(文件夹, 文件))
              and 文件.lower().endswith((".mp3", ".wav", ".ogg", ".m4a"))
          ]

          音乐列表.sort()

          with open("music/music.json", "w", encoding="utf-8") as f:
              json.dump(音乐列表, f, ensure_ascii=False, indent=2)

          print("音乐列表：")
          for 音乐 in 音乐列表:
              print(音乐)
          PY

      # 提交 music/music.json
      - name: 提交 music.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add music/music.json

          git diff --cached --quiet || git commit -m "自动更新音乐列表"
          git push
